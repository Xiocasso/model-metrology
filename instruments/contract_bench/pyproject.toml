[project]
name = "contract-bench"
version = "0.1.0"
description = "Tool-gating benchmark: 4-arm measurement of how contract presentation modality (none / narrative / query-plane / enforced) changes an LLM agent's tool-choice adherence to a frozen behavioral contract"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contract_bench*"]
