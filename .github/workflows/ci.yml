name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install numpy pydantic httpx pytest ruff
      - name: Lint
        run: ruff check --select E,F,W instruments experiments
      - name: Calibration tests (stress_probe)
        run: python -m pytest instruments/stress_probe/tests -q
      - name: Calibration tests (contract_bench)
        run: python -m pytest instruments/contract_bench/tests -q
      - name: Analysis selftest
        run: python experiments/01-stress-signature/analysis/analyze.py --selftest
